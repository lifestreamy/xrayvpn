---
# Restart xray is runtime-agnostic: both units are systemd-managed.

- name: Restart xray
  ansible.builtin.systemd:
    name: xray
    state: restarted
    daemon_reload: true
  become: true
  tags: config

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  tags: service

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  become: true
  tags: logs
