---
# Runs before any runtime_X.yml: apt deps + facts xray_container_image / xray_cli_command
# (uniform runtime-aware `xray` CLI invocation used by keys.yml).

- name: Install runtime-agnostic apt dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - unzip
    state: present
    update_cache: true
  become: true

- name: Set xray_container_image (override or derived from version)
  ansible.builtin.set_fact:
    xray_container_image: >-
      {{
        xray_docker_image
        if (xray_docker_image | default('') | length > 0)
        else (xray_container_repo ~ ':' ~ xray_version)
      }}

- name: Set xray_cli_command per runtime
  ansible.builtin.set_fact:
    xray_cli_command: >-
      {{
        '/usr/local/bin/xray'
        if (xray_runtime == 'native')
        else 'docker run --rm ' ~ xray_container_image ~ ' xray'
      }}
