---
# "Black box": a ~10 min read-only snapshot of host/service state lands in journald.

- name: Deploy xray-obs-snapshot script and units
  when: xray_obs_timer | default(true) | bool
  tags: obs
  block:
    - name: Install xray-obs-snapshot script
      ansible.builtin.template:
        src: xray-obs-snapshot.sh.j2
        dest: /usr/local/bin/xray-obs-snapshot
        mode: '0755'
      become: true

    - name: Install xray-obs-snapshot systemd unit
      ansible.builtin.template:
        src: xray-obs-snapshot.service.j2
        dest: /etc/systemd/system/xray-obs-snapshot.service
        mode: '0644'
      become: true
      notify: Reload systemd

    - name: Install xray-obs-snapshot systemd timer
      ansible.builtin.template:
        src: xray-obs-snapshot.timer.j2
        dest: /etc/systemd/system/xray-obs-snapshot.timer
        mode: '0644'
      become: true
      notify: Reload systemd

    - name: Enable and start xray-obs-snapshot timer
      ansible.builtin.systemd:
        name: xray-obs-snapshot.timer
        state: started
        enabled: true
        daemon_reload: true
      become: true

- name: Tear down xray-obs-snapshot when disabled
  when: not (xray_obs_timer | default(true) | bool)
  tags: obs
  block:
    - name: Stop and disable xray-obs-snapshot timer
      ansible.builtin.systemd:
        name: xray-obs-snapshot.timer
        state: stopped
        enabled: false
      become: true
      failed_when: false

    - name: Remove xray-obs-snapshot units and script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/xray-obs-snapshot.timer
        - /etc/systemd/system/xray-obs-snapshot.service
        - /usr/local/bin/xray-obs-snapshot
      become: true
      notify: Reload systemd
