ShortDescription: Консольный клиент для развёртывания и обслуживания личного VPN-сервера Xray VLESS + REALITY
Description: |-
  xrayvpn разворачивает личный VPN-сервер на вашем VPS: Xray-core с VLESS + REALITY, установка
  через одно SSH-подключение — домен и TLS-сертификат не нужны. Обслуживает сервер по SSH
  (статус, логи, перезапуск) и готовит клиентские профили для Clash Verge, FlClash и Amnezia.
  Поставляется одним переносимым исполняемым файлом; Python и другие окружения не нужны.

  Лицензия AGPL-3.0-or-later с дополнительным ограничением коммерческого использования:
  бесплатно для личного и некоммерческого использования, коммерческое — только с письменного
  разрешения автора.
