---
# Default scenario: delegated driver — Ansible runs on the host; xray_runtime native.
# Test knobs live in play vars: molecule ignores provisioner inventory group_vars.

dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml

driver:
  name: default

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../..
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml

verifier:
  name: ansible
