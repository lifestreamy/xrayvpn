---
# Distro-matrix scenario: systemd containers, image via MOLECULE_IMAGE (CI sets per leg).
# xray_manage_ufw=false here (scoping); ufw coverage — native CI job.

dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible}"
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../..
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml

verifier:
  name: ansible
