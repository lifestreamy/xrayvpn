---
# Molecule CI: gate (docs-only classifier), syntax, distro matrix
# (ubuntu2204/ubuntu2404/debian12 containers), native (full host run).
# Triggers: pull_request, workflow_dispatch (main protected; dev line via dispatch).
# Firewall off in distro legs: scoping; ufw tasks work in containers (verified);
# coverage — native job. Failure artifacts: molecule logs, 7 days.

name: molecule

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANSIBLE_CORE_VERSION: "2.21.3"

jobs:
  gate:
    name: classify changes (molecule)
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Docs-only check
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_docs=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -vE '\.md$|^docs/|^LICENSE' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  syntax:
    name: syntax-check
    needs: gate
    if: needs.gate.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: molecule/requirements.yml

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${ANSIBLE_CORE_VERSION}"

      - name: Cache ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('molecule/requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Install collections
        run: ansible-galaxy collection install -r molecule/requirements.yml

      - name: Syntax check
        run: ansible-playbook --syntax-check -i inventory.yml.example deploy.yml

  distro:
    name: molecule (${{ matrix.distro }})
    needs: [gate, syntax]
    if: needs.gate.outputs.docs_only == 'false' && needs.syntax.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu2204
            image: geerlingguy/docker-ubuntu2204-ansible
          - distro: ubuntu2404
            image: geerlingguy/docker-ubuntu2404-ansible
          - distro: debian12
            image: geerlingguy/docker-debian12-ansible
    env:
      MOLECULE_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: molecule/requirements.yml

      - name: Install molecule toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${ANSIBLE_CORE_VERSION}" molecule "molecule-plugins[docker]"

      - name: Cache ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('molecule/requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Molecule test (distro container scenario)
        run: molecule test -s distro

      - name: Upload molecule logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molecule-logs-distro-${{ matrix.distro }}-${{ github.run_id }}
          path: ~/.cache/molecule/
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: molecule (native + firewall)
    needs: [gate, syntax]
    if: needs.gate.outputs.docs_only == 'false' && needs.syntax.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: molecule/requirements.yml

      - name: Install molecule toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${ANSIBLE_CORE_VERSION}" molecule "molecule-plugins[docker]"

      - name: Cache ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('molecule/requirements.yml') }}
          restore-keys: ansible-collections-

      # ufw coverage — distro legs run with xray_manage_ufw=false (scoping).
      - name: Molecule test (host scenario, managed firewall)
        run: molecule test -- -e xray_manage_ufw=true

      - name: Upload molecule logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molecule-logs-native-${{ github.run_id }}
          path: ~/.cache/molecule/
          retention-days: 7
          if-no-files-found: ignore

