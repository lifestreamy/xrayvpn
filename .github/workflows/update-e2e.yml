---
# Real-GitHub update e2e: resolves the latest stable release, verifies
# latest.json + SHA256SUMS, downloads (cached per tag) and runs the fresh
# binary with --version. Triggers: workflow_dispatch, after release-binaries.
# Not a PR gate; executions never block pull requests.

name: update-e2e

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["release-binaries"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  e2e:
    name: update e2e (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: python-client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies from lockfile
        run: uv sync --frozen

      - name: Resolve the latest stable release
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the release asset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xrayvpn-e2e-cache
          key: update-e2e-${{ runner.os }}-${{ steps.tag.outputs.tag }}

      - name: Download, verify and run the fresh binary
        shell: bash
        run: uv run python ../scripts/cd/update_e2e.py --tag "${{ steps.tag.outputs.tag }}" --run
