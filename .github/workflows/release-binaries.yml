name: release-binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-binaries.yml"
      - "python-client/build-binary.*"
      - "python-client/build_binary.py"
      - "python-client/build_support.py"
      - "python-client/hatch_build.py"
      - "python-client/xrayvpn.spec"
      - "python-client/pyproject.toml"
      - "python-client/uv.lock"
      - "scripts/ci/make_release_manifest.py"
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build (preview mode; push runs use the tag)
        default: staging
      tag:
        description: Version source (a v-tag; empty = project version)
        default: ""

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            token: windows-x64
            ext: .exe
          - os: ubuntu-22.04
            token: linux-x64
            ext: ""
          - os: ubuntu-22.04-arm
            token: linux-arm64
            ext: ""
          - os: macos-latest
            token: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      RAW_REV: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Resolve version
        id: version
        working-directory: python-client
        run: |
          if ($env:RAW_REV -match '^v(.+?)(_(experimental|stable))?$') {
            $v = $Matches[1]
          } else {
            $v = (uv run python -c "import xrayvpn; print(xrayvpn.__version__)").Trim()
          }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Sync build group
        working-directory: python-client
        run: uv sync --frozen --group build
      - name: Build
        id: build
        working-directory: python-client
        run: |
          uv run --group build python build_binary.py --version "${{ steps.version.outputs.value }}"
          "asset=xrayvpn-${{ steps.version.outputs.value }}-${{ matrix.token }}-portable${{ matrix.ext }}" >> $env:GITHUB_OUTPUT
      - name: Smoke from a neutral cwd
        working-directory: python-client
        env:
          XRAYVPN_UPDATE_CHECK: "0"
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = "${{ steps.build.outputs.asset }}"
          $version = "${{ steps.version.outputs.value }}"
          $fixture = Join-Path ([IO.Path]::GetTempPath()) ("bin-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          Copy-Item (Join-Path "dist-binary" $artifact) -Destination $fixture
          $exe = Join-Path $fixture ("./" + $artifact)
          if ($IsLinux -or $IsMacOS) { chmod +x $exe }
          pushd $fixture
          try {
            $out = (& $exe --version | Out-String)
            $head = ($out -split "`r?`n")[0].Trim()
            if ($head -ne "xrayvpn $version") { throw "--version check failed: '$head'" }
            $dry = (& $exe deploy --dry-run --no-interactive --host 127.0.0.1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dry-run failed (rc=$LASTEXITCODE)" }
            foreach ($marker in @("deploy.yml", "roles/", "config/")) {
              if (-not $dry.Contains($marker.TrimEnd('/'))) { throw "bundle missing: $marker" }
            }
            $env:XRAYVPN_LANG = "ru"
            $ru = (& $exe deploy --dry-run --no-interactive --host 127.0.0.1 | Out-String)
            if (-not $ru.Contains("[превью]")) { throw "RU locale sentinel missing in frozen build" }
            $env:XRAYVPN_REPL_SELFTEST = "1"
            $repl = "deploy --dry-run --no-interactive --host 127.0.0.1`nexit" | & $exe repl | Out-String
            if ($LASTEXITCODE -ne 0) { throw "REPL selftest failed via binary (rc=$LASTEXITCODE)" }
            if (-not $repl.Contains("[превью]")) { throw "REPL selftest produced no deploy preview" }
          } finally {
            popd
            Remove-Item -Recurse -Force $fixture -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xrayvpn-${{ matrix.token }}
          path: python-client/dist-binary/${{ steps.build.outputs.asset }}
          if-no-files-found: error

  dist:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build wheel and sdist
        working-directory: python-client
        run: |
          uv build --wheel
          uv build --sdist
      - name: Smoke-install the wheel repo-free
        working-directory: python-client
        env:
          XRAYVPN_UPDATE_CHECK: "0"
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n1)"
          uv tool install --force "$wheel"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; uv tool uninstall xrayvpn >/dev/null 2>&1 || true' EXIT
          first="$( cd "$tmp" && xrayvpn --version | head -n1 )"
          dry="$( cd "$tmp" && xrayvpn deploy --dry-run --no-interactive --host 127.0.0.1 )"
          grep -q 'deploy\.yml' <<<"$dry"
          grep -q 'roles' <<<"$dry"
          grep -q 'config' <<<"$dry"
          [[ "$first" == xrayvpn* ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python-client/dist/
          if-no-files-found: error

  deb:
    needs: [build]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      RAW_REV: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xrayvpn-linux-x64
          path: bundle
      - name: Package the .deb
        run: |
          set -euo pipefail
          raw="$RAW_REV"
          if [ -n "$raw" ] && [ "${raw#v}" != "$raw" ]; then
            version="${raw#v}"
            version="${version%%_*}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' python-client/pyproject.toml | head -n1)"
          fi
          test -n "$version"
          root="root"
          install -d "$root/usr/bin"
          install -m 0755 bundle/xrayvpn-*-linux-x64-portable "$root/usr/bin/xrayvpn"
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import make_icon

          usr = Path("root/usr")
          desktop = usr / "share/applications/xrayvpn.desktop"
          desktop.parent.mkdir(parents=True, exist_ok=True)
          desktop.write_text(
              "[Desktop Entry]\n"
              "Type=Application\n"
              "Name=xrayvpn\n"
              "Comment=Provision Xray VLESS + REALITY VPN servers\n"
              "Exec=xrayvpn\n"
              "Terminal=true\n"
              "Icon=xrayvpn\n"
              "Categories=Network;Utility;\n",
              encoding="utf-8",
          )
          icon = usr / "share/icons/hicolor/256x256/apps/xrayvpn.png"
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_bytes(make_icon.render_pngs()[256])
          PY
          sudo gem install --no-document fpm
          mkdir -p deb
          fpm -s dir -t deb \
            -n xrayvpn -v "$version" --architecture amd64 \
            --deb-priority optional \
            --maintainer "Tim Korelov <timkorelov@gmail.com>" \
            --description "Python client for provisioning Xray VLESS + REALITY VPN servers" \
            --url "https://github.com/lifestreamy/xrayvpn" \
            --license "AGPL-3.0-or-later" \
            --package "deb/xrayvpn_${version}_amd64.deb" \
            -C "$root" .
          dpkg-deb -I "deb/xrayvpn_${version}_amd64.deb"
          dpkg-deb -c "deb/xrayvpn_${version}_amd64.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: deb/*.deb
          if-no-files-found: error

  release:
    needs: [build, dist, deb]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: assets
          merge-multiple: true
      - name: Checksums and update manifest
        working-directory: assets
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum xrayvpn* > SHA256SUMS.txt
          case "$TAG" in
            *_experimental) ;;
            *_*) echo "unsupported release suffix for $TAG" >&2; exit 1 ;;
            *) python3 ../scripts/ci/make_release_manifest.py --dir . --release "$REPOSITORY" --tag "$TAG" ;;
          esac
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--draft --title "$TAG")
          case "$TAG" in
            *_experimental) flags+=(--prerelease) ;;
            *_*) echo "unsupported release suffix for $TAG" >&2; exit 1 ;;
          esac
          gh release create "${flags[@]}" --notes "Pre-built by the release-binaries workflow from tag ${TAG}. Binaries: four platform onefile builds plus wheel/sdist; see SHA256SUMS.txt and latest.json." -- assets/*
