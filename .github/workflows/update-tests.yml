---
# Update-path gates (manual): update unit suites plus the running-binary swap
# smoke on ubuntu/windows. PR coverage comes from python-client.yml.

name: update-tests

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  update-gates:
    name: update tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: python-client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies from lockfile
        run: uv sync --frozen

      - name: Update unit and swap-smoke tests
        run: >-
          uv run python -m pytest -q
          tests/test_update.py
          tests/test_install_source.py
          tests/test_update_state.py
          tests/test_cli_update.py
          tests/test_update_check.py
          tests/test_swap_smoke.py
          tests/test_update_e2e_script.py
