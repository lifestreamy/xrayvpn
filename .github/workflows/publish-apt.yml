name: publish-apt

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to repair (the .deb is taken from its assets)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    environment: apt
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Fetch the .deb from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          mkdir -p deb
          gh release download "$TAG" --pattern '*.deb' --dir deb
          test "$(find deb -type f -name '*.deb' | wc -l)" -eq 1
          test "$(dpkg-deb -f deb/*.deb Package)" = "xrayvpn"
          test "$(dpkg-deb -f deb/*.deb Architecture)" = "amd64"
      - name: Import the archive signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_GPG_PRIVATE_KEY"
          install -d -m 700 "$HOME/.gnupg"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$fpr"
          echo "KEY_FPR=$fpr" >> "$GITHUB_ENV"
      - name: Build the signed archive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aptly
          root_dir="$PWD/aptly"
          printf '{"rootDir": "%s"}\n' "$root_dir" > aptly.conf
          aptly -config=aptly.conf repo create xrayvpn
          aptly -config=aptly.conf repo add xrayvpn deb/*.deb
          for dist in noble bookworm; do
            aptly -config=aptly.conf publish repo \
              -distribution="$dist" -component=main -architectures=amd64 \
              -gpg-key="$KEY_FPR" xrayvpn
          done
          mkdir -p site/apt
          cp -a "$root_dir/public/." site/apt/
          gpg --export "$KEY_FPR" > site/apt/xrayvpn-archive-keyring.gpg
          test -s site/apt/xrayvpn-archive-keyring.gpg
          for dist in noble bookworm; do
            test -s "site/apt/dists/$dist/InRelease"
          done
          find site/apt/dists -maxdepth 2 -type f
      - uses: actions/upload-artifact@330a80a2a216371195056eb380486c0df05cbd70 # v5.0.8
        with:
          name: apt-pages
          path: site
          if-no-files-found: error

  deploy:
    needs: [publish]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}apt/
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@85b33142143d8d70e61a4ad1f2283cfb1485ed98 # v5.0.0
        with:
          name: apt-pages
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
